<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaPiTopUp</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
  :root { --purple:#6f3b91; --ink:#24182e; --bg:#f4eef8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--purple); color:#fff; text-align:center; padding:32px 16px 44px; }
  header h1 { margin:0 0 6px; font-size:2rem; }
  header p { margin:0; opacity:.9; }
  main { max-width:480px; margin:-24px auto 32px; padding:0 16px; }
  form { background:#fff; border-radius:20px; padding:24px; box-shadow:0 6px 20px rgba(60,20,90,.12); }
  h2 { margin:0 0 8px; color:var(--purple); }
  label { display:block; font-weight:600; margin:16px 0 6px; }
  input, select { width:100%; padding:14px; border:1px solid #cdbfd8; border-radius:12px; font-size:1rem; background:#fff; color:var(--ink); }
  input[readonly] { background:#f1eaf6; }
  input:focus, select:focus, button:focus-visible { outline:3px solid #b98fd6; outline-offset:1px; }
  button { width:100%; margin-top:24px; padding:16px; border:0; border-radius:14px; background:var(--purple); color:#fff; font-size:1.1rem; font-weight:700; }
  button:disabled { opacity:.6; }
  #planBox { display:none; }
  #price { margin-top:16px; padding:12px 14px; border-radius:12px; background:#f1eaf6; font-weight:700; color:var(--purple); text-align:center; }
  #status { display:none; margin-top:16px; padding:12px 14px; border-radius:12px; font-size:.95rem; }
  #status.ok { display:block; background:#e5f6ea; color:#14532d; }
  #status.err { display:block; background:#fdeaea; color:#7f1d1d; }
  #status.info { display:block; background:#ece4f3; color:#3b1d52; }
  footer { text-align:center; padding:0 16px 32px; font-size:.85rem; color:#6b5a78; }
</style>
</head>
<body>
<header>
  <h1>AlphaPiTopUp</h1>
  <p>Airtime &amp; Data with Pi</p>
</header>

<main>
  <form id="topup">
    <h2>Buy Airtime &amp; Data</h2>

    <label for="phone">Phone Number</label>
    <input id="phone" name="phone" type="tel" inputmode="numeric" placeholder="08012345678" required>

    <label for="network">Network</label>
    <select id="network" name="network" required>
      <option value="">Select Network</option>
      <option>MTN</option>
      <option>Airtel</option>
      <option>Glo</option>
      <option>9mobile</option>
    </select>

    <label for="service">Service</label>
    <select id="service" name="service" required>
      <option value="">Choose Service</option>
      <option>Airtime</option>
      <option>Data Bundle</option>
    </select>

    <div id="planBox">
      <label for="plan">Data Plan</label>
      <select id="plan" name="plan">
        <option value="">Select Plan</option>
      </select>
    </div>

    <label for="amount">Amount (NGN)</label>
    <input id="amount" name="amount" type="number" inputmode="numeric" placeholder="Enter amount">

    <div id="price">Price: -</div>

    <button id="pay" type="submit">Continue with Pi</button>
    <div id="status" role="status"></div>
  </form>
</main>

<footer>Buy mobile airtime and data bundles using Pi. &copy; 2026 AlphaPiTopUp</footer>

<script>
  var API = "https://alphapitopup-api.vercel.app";
  var NGN_PER_PI = 80;
  var rateLoaded = false;

  Pi.init({ version: "2.0", sandbox: true });

  var form = document.getElementById("topup");
  var btn = document.getElementById("pay");
  var box = document.getElementById("status");
  var priceBox = document.getElementById("price");
  var planBox = document.getElementById("planBox");
  var planSel = document.getElementById("plan");
  var plans = [];

  function show(type, text) { box.className = type; box.textContent = text; }
  function isData() { return form.service.value === "Data Bundle"; }

  function piFor(ngn) {
    return Math.ceil((ngn / NGN_PER_PI) * 100) / 100;
  }

  function updatePrice() {
    var n = parseInt(form.amount.value, 10);
    if (n > 0) {
      priceBox.textContent = "Price: " + piFor(n).toFixed(2) + " Pi";
    } else {
      priceBox.textContent = "Price: -";
    }
  }

  async function loadRate() {
    try {
      var r = await fetch(API + "/api/rate");
      var d = await r.json();
      if (d && d.ngnPerPi > 0) {
        NGN_PER_PI = d.ngnPerPi;
        rateLoaded = true;
      }
    } catch (e) {}
    updatePrice();
  }

  async function post(path, body) {
    var r = await fetch(API + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    var data = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(data.error || ("Server error " + r.status));
    return data;
  }

  async function loadPlans() {
    plans = [];
    form.amount.value = "";
    updatePrice();
    planSel.innerHTML = '<option value="">Select Plan</option>';
    if (!isData() || !form.network.value) return;
    planSel.innerHTML = '<option value="">Loading plans...</option>';
    try {
      var r = await fetch(API + "/api/plans?network=" + encodeURIComponent(form.network.value));
      var d = await r.json();
      plans = (d.plans || []).slice().sort(function (a, b) { return a.amount - b.amount; });
      if (!plans.length) {
        planSel.innerHTML = '<option value="">No plans available</option>';
        return;
      }
      planSel.innerHTML = '<option value="">Select Plan</option>';
      plans.forEach(function (p) {
        var o = document.createElement("option");
        o.value = p.code;
        o.textContent = p.name;
        planSel.appendChild(o);
      });
    } catch (e) {
      planSel.innerHTML = '<option value="">Could not load plans</option>';
    }
  }

  function refreshMode() {
    if (isData()) {
      planBox.style.display = "block";
      form.amount.readOnly = true;
      form.amount.placeholder = "Choose a plan";
      loadPlans();
    } else {
      planBox.style.display = "none";
      form.amount.readOnly = false;
      form.amount.placeholder = "Enter amount";
      form.amount.value = "";
      updatePrice();
    }
  }

  form.service.addEventListener("change", refreshMode);
  form.network.addEventListener("change", function () { if (isData()) loadPlans(); });
  form.amount.addEventListener("input", updatePrice);
  planSel.addEventListener("change", function () {
    var p = plans.filter(function (x) { return x.code === planSel.value; })[0];
    form.amount.value = p ? p.amount : "";
    updatePrice();
  });

  loadRate();

  function onIncompletePaymentFound(payment) {
    var txid = payment.transaction && payment.transaction.txid;
    if (txid) post("/api/complete", { paymentId: payment.identifier, txid: txid }).catch(function () {});
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var phone = form.phone.value.trim();
    var network = form.network.value;
    var service = form.service.value;
    var amount = form.amount.value;
    var planCode = "";
    var planName = "";

    if (!/^0\d{10}$/.test(phone)) {
      show("err", "Enter an 11-digit Nigerian phone number, like 08012345678.");
      return;
    }
    if (service === "Data Bundle") {
      var p = plans.filter(function (x) { return x.code === planSel.value; })[0];
      if (!p) {
        show("err", "Please choose a data plan.");
        return;
      }
      planCode = p.code;
      planName = p.name;
      amount = String(p.amount);
    } else if (service === "Airtime") {
      if (!(parseInt(amount, 10) >= 50)) {
        show("err", "Minimum airtime amount is 50 NGN.");
        return;
      }
    } else {
      show("err", "Please choose a service.");
      return;
    }
    if (!rateLoaded) {
      show("err", "Could not load the price. Refresh the page and try again.");
      return;
    }

    var piAmount = piFor(parseInt(amount, 10));
    var label = service === "Data Bundle" ? planName : (amount + " NGN " + network + " airtime");

    btn.disabled = true;
    show("info", "Opening Pi...");

    try {
      await Pi.authenticate(["username", "payments"], onIncompletePaymentFound);
      show("info", "Confirm the payment of " + piAmount.toFixed(2) + " Pi.");

      var metadata = { phone: phone, network: network, service: service, amount: amount };
      if (planCode) metadata.plan = planCode;

      Pi.createPayment(
        {
          amount: piAmount,
          memo: service === "Data Bundle" ? (network + " " + planName) : (service + " " + amount + " NGN " + network),
          metadata: metadata
        },
        {
          onReadyForServerApproval: function (paymentId) {
            post("/api/approve", { paymentId: paymentId }).catch(function () {
              show("err", "Could not reach the server. Try again.");
              btn.disabled = false;
            });
          },
          onReadyForServerCompletion: async function (paymentId, txid) {
            try {
              await post("/api/complete", { paymentId: paymentId, txid: txid });
            } catch (err) {
              show("err", "Payment was sent but could not be confirmed. Keep this screen and contact support.");
              btn.disabled = false;
              return;
            }
            show("info", "Payment received. Sending your order...");
            try {
              var d = await post("/api/deliver", { paymentId: paymentId });
              if (d.code === "000") {
                show("ok", "Done! " + label + " sent to " + phone + ".");
              } else {
                show("err", "Payment received but delivery failed: " + (d.message || "unknown error") + ". Keep this screen and contact support.");
              }
            } catch (err) {
              show("err", "Payment received but delivery failed: " + err.message + ". Keep this screen and contact support.");
            }
            btn.disabled = false;
          },
          onCancel: function () { show("err", "Payment cancelled."); btn.disabled = false; },
          onError: function (error) { show("err", "Payment failed: " + error.message); btn.disabled = false; }
        }
      );
    } catch (err) {
      show("err", "Open this page in Pi Browser, then try again.");
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
